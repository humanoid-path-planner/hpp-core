[build-system]
build-backend = "cmeel"
requires = [
  "cmeel-boost[build] ~= 1.90.0",
  "cmeel[build]",
  "hpp-constraints[build]",
  "hpp-pinocchio[build]",
  "hpp-statistics[build]",
  "hpp-util[build]",
  "proxsuite[build]"
]

[project]
authors = [
  { name = "Florent Lamiraux" },
  { name = "Joseph Mirabel" }
]
dependencies = [
  "cmeel-boost ~= 1.90.0",
  "hpp-constraints",
  "hpp-pinocchio",
  "hpp-statistics",
  "hpp-util",
  "proxsuite"
]
description = "Implement basic classes for canonical path planning for kinematic chains"
license = "BSD-2-Clause"
maintainers = [
  { email = "guilhem.saurel@laas.fr", name = "Guilhem Saurel" }
]
name = "hpp-core"
version = "9.3.0"

[project.urls]
homepage = "https://github.com/humanoid-path-planner/hpp-core"
issues = "https://github.com/humanoid-path-planner/hpp-core/issues"
repository = "https://github.com/humanoid-path-planner/hpp-core"

[tool.cmeel]
has-sitelib = false

[tool.ruff.lint]
extend-select = ["I", "NPY", "RUF", "UP", "W"]

[tool.tomlsort]
all = true
